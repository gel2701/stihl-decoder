name: Install fetch-stihl-products

on:
  push:
    branches:
      - chore/install-fetch-stihl-products-2026-09-17

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/install-fetch-stihl-products-2026-09-17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install fetch-stihl-products as isolated import/development tool
        run: npm install --save-dev --save-exact fetch-stihl-products@2.0.5
      - name: Smoke test package export
        run: node -e "const f=require('fetch-stihl-products'); if(typeof f!=='function') throw new Error('fetch-stihl-products export is not callable'); console.log('fetch-stihl-products load OK')"
      - name: Run stable core regression tests
        run: |
          node tests/decoder.test.js
          node tests/baseline.test.js
          node tests/phase38a3_confirmed_spec_parity.test.js
          node tests/phase38b_maintenance_return_loop.test.js
          node tests/phase38d_ms251_evidence_activation.test.js
          node tests/phase38e_baseline_architecture.test.js
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: install fetch-stihl-products 2.0.5 as dev tool"
          git push origin HEAD:chore/install-fetch-stihl-products-2026-09-17
